{% load static %}

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro realizado — Meu Bolso</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body class="auth-page">

    <div class="auth-card" style="text-align:center">

        <div class="auth-brand" style="justify-content:center">
            <span class="mark">Meu Bolso</span>
        </div>

        <div class="form-msg success show" style="margin-top:18px">
            Cadastro realizado com sucesso!
        </div>

        <h1 style="margin-top:8px">
            Esta é a sua conta?
        </h1>

        <p class="subtitle">
            {{ email }}
        </p>

        <a
            href="{% url 'login' %}"
            class="btn btn-primary"
            style="margin-bottom:10px"
        >
            Sim, ir para o login
        </a>

        <a
            href="{% url 'cadastro' %}"
            class="btn btn-ghost"
            style="width:100%"
        >
            Voltar ao cadastro
        </a>

    </div>

</body>
</html>
